name: deterministic-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-api.txt

      - name: Verify and restore immutable runtime artifacts
        run: |
          sha256sum --check artifacts/runtime_artifacts.sha256
          tar -xzf artifacts/runtime_artifacts.tar.gz

      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements-api.txt "pytest>=8,<9"

      - name: Compile source
        run: python -m compileall -q src tests

      - name: Run deterministic test suite
        env:
          APP_ENV: test
          API_AUTH_ENABLED: "false"
          RATE_LIMIT_ENABLED: "false"
        run: python -m pytest -q

      - name: Run basic credential check
        run: python scripts/check_secrets.py

      - name: Build production Docker image
        run: docker build -t delivery-risk-api:ci .

      - name: Verify image runs as non-root
        run: |
          test "$(docker run --rm --entrypoint id delivery-risk-api:ci -u)" != "0"
